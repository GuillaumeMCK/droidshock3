name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

# A newer push to the same branch or pull request supersedes the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.50.1

defaults:
  run:
    shell: bash

jobs:
  build:
    name: android-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Release signing. Unset (pull requests from forks, say), the release
      # build falls back to the debug key; tags refuse to publish without it.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # A release is named after pubspec.yaml's version, so the tag must match.
      - name: Check version
        id: version
        run: |
          version=$(sed -n 's/^version: *//p' droidshock3/pubspec.yaml)
          version=${version%%+*} # Without the build number.
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_REF == refs/tags/v* && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml version $version"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            droidshock3/android/*.gradle*
            droidshock3/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # The SDK, and the pub cache keyed on pubspec.lock.
          cache: true

      - name: Get packages
        run: |
          flutter config --no-analytics --no-cli-animations > /dev/null
          flutter pub get

      # Routes, injection and assets are generated, not committed.
      - name: Generate code
        working-directory: droidshock3
        run: dart run build_runner build --delete-conflicting-outputs

      # The bridge embeds usb_gadget's Rust library, which
      # tool/build_bridge.sh builds; an empty one is enough to analyze it.
      - name: Generate bridge code
        working-directory: bridge
        run: |
          mkdir -p assets && touch assets/libusb_gadget_native.so
          dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed protocol ffsds3 bridge droidshock3/lib

      - name: Analyze
        run: flutter analyze

      # Read by android/app/build.gradle.kts.
      - name: Set up signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: droidshock3/android
        run: |
          base64 --decode <<< "$ANDROID_KEYSTORE_BASE64" > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Require signing for releases
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Releases must be signed: set the ANDROID_KEYSTORE_* and ANDROID_KEY_* secrets"
          exit 1

      # The bridge binary in assets/ is arm64, so the app is too.
      - name: Build
        working-directory: droidshock3
        run: flutter build apk --release --no-pub --target-platform android-arm64

      - name: Package
        run: |
          mkdir -p dist
          cp droidshock3/build/app/outputs/flutter-apk/app-release.apk \
            "dist/droidshock3-${{ steps.version.outputs.version }}-arm64-v8a.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: droidshock3-android-arm64
          path: dist/*
          # Already compressed.
          compression-level: 0
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
