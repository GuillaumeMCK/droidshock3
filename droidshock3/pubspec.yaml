name: droidshock3
version: 1.0.0

environment:
  sdk: ^3.11.0

dependencies:
  # -- Flutter SDK --
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # -- Local packages --
  ffsds3:
    path: ../ffsds3
  bridge:
    path: ../bridge
  # -- Pub packages --
  auto_route: ^11.1.0
  flutter_native_splash: ^2.4.7
  flutter_bloc: ^9.1.1
  injectable: ^2.7.1+4
  leancode_hooks: ^0.1.2+1
  path_provider: ^2.1.5
  root_plus: ^1.1.0
  shadcn_ui: ^0.53.1
  gamepads: ^0.1.9
  sensors_plus: ^7.0.0

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.12.2
  flutter_gen_runner: ^5.13.0
  injectable_generator: ^2.12.1
  leancode_lint: ^22.0.0
  lints: ^6.1.0
  dart_style: ^3.1.6
  analyzer: ^10.0.0

dependency_overrides:
  meta: ^1.18.1

flutter:
  uses-material-design: false
  assets:
    - assets/bridge

flutter_gen:
  output: lib/common/gen/

flutter_native_splash:
  color: "#F9F9F9"
  color_dark: "#000000"
  android_12:
    color: "#F9F9F9"
    color_dark: "#000000"

scripts:
  format:
    dart fix --apply lib/;
    dart format lib/;
  gen:
    dart pub get;
    dart run build_runner build --delete-conflicting-outputs;

