name: droidshock3
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  # -- Flutter SDK --
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # -- Local packages --
  protocol:
    path: ../protocol
  # -- Pub packages --
  auto_route: ^11.2.0
  flutter_native_splash: ^2.4.8
  flutter_bloc: ^9.1.1
  injectable: ^3.0.0
  leancode_hooks: ^0.1.2+1
  path_provider: ^2.1.6
  root_plus: ^1.1.0
  shadcn_ui: ^0.61.2
  gamepads: ^0.1.15
  sensors_plus: ^7.1.1
  screen_brightness: ^2.1.11
  lucide_icons_flutter: ^4.0.3
  bloc: ^9.2.1
  provider: ^6.1.5+1
  get_it: ^9.3.0

dev_dependencies:
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_gen_runner: ^5.15.0
  injectable_generator: ^3.1.3
  leancode_lint: ^28.0.0
  lints: ^6.1.0

flutter:
  uses-material-design: false
  assets:
    - assets/bridge

flutter_gen:
  output: lib/common/gen/

flutter_native_splash:
  color: "#F9F9F9"
  color_dark: "#000000"
  android_12:
    color: "#F9F9F9"
    color_dark: "#000000"

scripts:
  format:
    dart fix --apply lib/;
    dart format lib/;
  gen:
    dart pub get;
    dart run build_runner build --delete-conflicting-outputs;

