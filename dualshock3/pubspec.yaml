name: dualshock3

environment:
  sdk: ^3.11.0

dependencies:
  # -- Flutter SDK --
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # -- Pub packages --
  auto_route: ^11.1.0
  flutter_native_splash: ^2.4.7
  flutter_bloc: ^9.1.1
  injectable: ^2.7.1+4
  leancode_hooks: ^0.1.2+1
  path_provider: ^2.1.5
  root_plus: ^1.1.0
  shadcn_ui: ^0.50.1
  universal_gamepad: ^1.5.0
  # -- Local packages --
  ffsds3:
    path: ../ffsds3
  bridge:
    path: ../bridge

dev_dependencies:
  auto_route_generator: ^10.5.0
  build_runner: ^2.12.2
  flutter_gen_runner: ^5.13.0
  flutter_launcher_icons: ^0.14.4
  injectable_generator: ^2.12.1
  leancode_lint: ^21.0.0+1
  lints: ^6.0.0
  dart_style: ^3.1.6
  analyzer: ^10.0.0

dependency_overrides:
  meta: ^1.18.1

flutter:
  uses-material-design: false
  assets:
    - assets/bridge

flutter_gen:
  output: lib/common/gen/

flutter_launcher_icons:
  android: true
  image_path: assets/icons/ic_logo.png
  adaptive_icon_foreground: assets/icons/ic_android_foreground.png
  adaptive_icon_background: "#0D336E"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"

scripts:
  format:
    dart fix --apply lib/;
    dart format lib/;
  codegen:
    dart pub get;
    dart run build_runner build --delete-conflicting-outputs;
    dart run flutter_launcher_icons:main;
    dart run flutter_native_splash:create;

